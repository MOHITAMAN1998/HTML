<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Varanasi Chale?</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      overflow:hidden;
      background:black;
      color:white;
    }

    .hero{
      position:relative;
      width:100%;
      height:100vh;
      background:url('https://images.unsplash.com/photo-1561361513-2d000a50f0dc?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.55);
    }

    .content{
      position:relative;
      z-index:2;
      animation: fadeIn 2s ease;
    }

    h1{
      font-size:5rem;
      letter-spacing:4px;
      text-shadow:0 0 20px rgba(255,255,255,0.7);
    }

    p{
      margin-top:20px;
      font-size:1.5rem;
      color:#f5d6a1;
    }

    .buttons{
      margin-top:40px;
      position:relative;
      height:100px;
    }

    button{
      padding:15px 35px;
      border:none;
      border-radius:50px;
      font-size:1.1rem;
      cursor:pointer;
      transition:0.3s;
      position:absolute;
    }

    #yesBtn{
      background:#ff9800;
      color:white;
      left:35%;
    }

    #noBtn{
      background:white;
      color:#ff9800;
      right:35%;
    }

    #yesBtn:hover{
      transform:scale(1.1);
    }

    .message{
      position:absolute;
      inset:0;
      background:black;
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      z-index:5;
    }

    .message img{
      width:350px;
      border-radius:20px;
      margin-bottom:25px;
      box-shadow:0 0 30px rgba(255,255,255,0.3);
    }

    .message h2{
      font-size:3rem;
      color:#ffcc80;
    }

    .message p{
      color:white;
      margin-top:15px;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .floating{
      position:absolute;
      font-size:25px;
      animation: float 6s linear infinite;
      opacity:0.8;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh);
        opacity:0;
      }
      20%{
        opacity:1;
      }
      100%{
        transform:translateY(-120vh);
        opacity:0;
      }
    }
  </style>
</head>

<body>

  <div class="hero">

    <div class="overlay"></div>

    <div class="content">
      <h1>VARANASI CHALE? ✨</h1>
      <p>Ghat pe chai, ganga aarti aur tum ❤️</p>

      <div class="buttons">
        <button id="yesBtn">Chalo ❤️</button>
        <button id="noBtn">Nahi 😅</button>
      </div>
    </div>

  </div>

  <div class="message" id="message">
    <img src="https://images.unsplash.com/photo-1515091943-9d5c0ad475af?q=80&w=1200&auto=format&fit=crop" alt="Varanasi">
    <h2>Tickets Booked 🎉</h2>
    <p>Ab hum dono Varanasi jaa rahe hain ❤️</p>
  </div>

  <script>

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    // Running No Button
    noBtn.addEventListener("mouseover", () => {

      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 100);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

    });

    // Yes Button Click
    yesBtn.addEventListener("click", () => {

      message.style.display = "flex";

      for(let i=0; i<40; i++){
        createFloating();
      }

    });

    // Floating Hearts
    function createFloating(){

      const float = document.createElement("div");

      float.classList.add("floating");

      const items = ["❤️","✨","🧡","🌸"];

      float.innerHTML = items[Math.floor(Math.random()*items.length)];

      float.style.left = Math.random() * window.innerWidth + "px";

      float.style.fontSize = (20 + Math.random()*30) + "px";

      document.body.appendChild(float);

      setTimeout(() => {
        float.remove();
      }, 6000);

    }

  </script>

</body>
</html>
